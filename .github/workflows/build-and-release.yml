name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore & Environment
        run: |
          touch .env
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generando debug.keystore de respaldo..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Android APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          chmod +x gradlew || true
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/AnotadorDomino.apk
          echo "{\"buildNumber\": ${{ github.run_number }}, \"commitSha\": \"${{ github.sha }}\", \"timestamp\": $(date +%s%3N), \"publishedAt\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" > release-artifacts/version.json

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnotadorDomino-apk
          path: |
            release-artifacts/AnotadorDomino.apk
            release-artifacts/version.json

      - name: Publish Versioned Release (Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/AnotadorDomino.apk
            release-artifacts/version.json
          generate_release_notes: true

      - name: Publish / Update Latest Release (Branch push & manual trigger)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Última Versión (Auto-Release)"
          body: |
            🚀 **APK actualizado automáticamente con los últimos cambios.**

            📲 **Descarga directa para Android:**
            Haz clic aquí para descargar e instalar el archivo:
            [📥 Descargar AnotadorDomino.apk](https://github.com/${{ github.repository }}/releases/download/latest/AnotadorDomino.apk)
          draft: false
          prerelease: false
          files: |
            release-artifacts/AnotadorDomino.apk
            release-artifacts/version.json
